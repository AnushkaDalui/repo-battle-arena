<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repo Battle Arena</title>
<style>
:root{--bg:#090b14;--panel:#121725;--panel2:#171e30;--line:#28334b;--text:#f3f6ff;--muted:#9ba8c2;--purple:#a78bfa;--cyan:#67e8f9;--pink:#fb7185;--gold:#fbbf24;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#20224a 0,transparent 38%),radial-gradient(ellipse at 90% 15%,#123344 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:30px 18px 50px}
.wrap{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:36px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:1.5px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--purple),#6366f1);font-size:23px;box-shadow:0 8px 30px #8b5cf644}.pill{border:1px solid #34405a;background:#111827aa;color:#b9c5dc;padding:8px 12px;border-radius:99px;font-size:12px;letter-spacing:.7px}
.hero{text-align:center;margin-bottom:28px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:3px;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(32px,5vw,58px);line-height:1.04;letter-spacing:-2px;margin:12px 0;background:linear-gradient(90deg,#fff,var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);margin:0;font-size:15px}
.control{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:#0e1422d9;border:1px solid var(--line);padding:16px;border-radius:22px;box-shadow:0 18px 60px #0003;margin-bottom:24px}.field label{display:block;color:#aab6ce;font-size:11px;font-weight:800;letter-spacing:1.5px;margin:0 0 8px 3px}.field input,.field select{width:100%;min-width:0;border:1px solid #35415d;background:#171f31;color:#f4f7ff;padding:14px;border-radius:12px;font-size:14px;outline:none}.field input:focus,.field select:focus{border-color:var(--purple);box-shadow:0 0 0 3px #a78bfa22}.vs{font-weight:1000;font-style:italic;color:var(--pink);font-size:20px;text-shadow:0 0 18px #fb718555}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 26px}.select-wrap{display:flex;gap:10px;align-items:center}.select-wrap .field{width:230px}.fight{border:0;border-radius:12px;padding:14px 28px;color:#0a1020;font-weight:1000;letter-spacing:1px;font-size:14px;background:linear-gradient(100deg,var(--cyan),var(--purple));box-shadow:0 8px 28px #67e8f933;cursor:pointer;transition:.2s}.fight:hover{transform:translateY(-2px);filter:brightness(1.08)}.fight:disabled{opacity:.55;cursor:wait;transform:none}
#msg{min-height:24px;text-align:center;color:var(--cyan);font-size:14px;margin:8px 0} .err{color:#fda4af}.arena{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1000px;margin:0 auto}.card{position:relative;overflow:hidden;background:linear-gradient(155deg,#182238,#101522 75%);border:1px solid #34415d;border-radius:22px;padding:22px;transition:transform .25s,border-color .25s,opacity .25s;min-width:0}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--purple),transparent)}.card:nth-child(2):before{background:linear-gradient(90deg,var(--pink),transparent)}.card-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.avatar{width:62px;height:62px;object-fit:cover;border-radius:18px;border:1px solid #4a5774;background:#252e44}.card h3{font-size:18px;margin:0 0 5px;overflow-wrap:anywhere}.type{font-size:12px;color:var(--muted)}.hp-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#bac6dc;margin-bottom:8px}.hp-label b{font-size:16px;color:white}.hpwrap{height:10px;background:#080c14;border-radius:99px;overflow:hidden;border:1px solid #29344a}.hp{height:100%;width:100%;background:linear-gradient(90deg,#34d399,#a3e635);border-radius:99px;transition:width .6s,background .4s}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.stat{background:#0b111e88;border:1px solid #29344a;border-radius:12px;padding:11px}.stat span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.stat b{font-size:18px}.stat small{display:block;color:#71809d;font-size:10px;margin-top:4px}.hit{animation:shake .35s}.win{border-color:var(--gold);box-shadow:0 0 0 1px #fbbf2433,0 0 38px #fbbf2417}.dead{opacity:.48;filter:grayscale(.8)}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#banner{text-align:center;font-size:clamp(22px,4vw,34px);font-weight:1000;color:var(--gold);margin:22px 0;text-shadow:0 0 28px #fbbf2433}#log{max-width:850px;margin:18px auto}.log-title{font-size:11px;letter-spacing:2px;color:#aab6ce;font-weight:800;margin:0 0 10px}.line{padding:12px 15px;margin:8px 0;background:#121a2a;border:1px solid #27334a;border-left:3px solid var(--purple);border-radius:10px;color:#dce5f7;font-size:14px;line-height:1.5;animation:appear .25s}.crit{border-left-color:var(--gold);background:#272218}.line:first-of-type{border-left-color:var(--cyan)}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}#src{text-align:center;display:block;color:#7785a0;font-size:11px;margin-top:20px}.footer{text-align:center;color:#66738e;font-size:11px;margin-top:42px}.footer span{color:#aab6ce}
@media(max-width:700px){body{padding:20px 12px}.top{margin-bottom:25px}.pill{display:none}.control{grid-template-columns:1fr;padding:13px}.vs{text-align:center}.arena{grid-template-columns:1fr}.select-wrap{width:100%;flex-direction:column}.select-wrap .field{width:100%}.fight{width:100%}.card{padding:17px}.hero h1{letter-spacing:-1px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="brand"><div class="logo">⚔</div><span>REPO BATTLE <span style="color:var(--cyan)">ARENA</span></span></div><div class="pill">● LIVE REPOSITORY SHOWDOWN</div></header>
<section class="hero"><div class="eyebrow">REAL DATA. REAL STATS. ONE CHAMPION.</div><h1>WHO WILL WIN THE COMMIT WAR?</h1><p>Choose two GitHub repositories. Let the battle begin.</p></section>
<section class="control" aria-label="Battle setup">
<div class="field"><label for="a">FIGHTER ONE</label><input id="a" value="torvalds/linux" placeholder="owner/repository"></div><div class="vs">VS</div><div class="field"><label for="b">FIGHTER TWO</label><input id="b" value="python/cpython" placeholder="owner/repository"></div>
</section><div class="actions"><div class="select-wrap"><div class="field"><label for="style">COMMENTARY STYLE</label><select id="style"><option value="pokemon">Pokémon announcer</option><option value="cricket">Cricket commentator</option><option value="anime">Anime narrator</option><option value="shakespeare">Shakespeare</option><option value="wrestling">Wrestling</option></select></div><button id="go" class="fight">⚡ START BATTLE</button></div></div>
<div id="msg" role="status"></div><section class="arena" id="arena" aria-live="polite"></section><div id="banner" aria-live="polite"></div><section id="log"></section><small id="src"></small><footer class="footer">POWERED BY <span>GITHUB DATA</span> · DECIDED BY CODE · NARRATED BY AI</footer>
</main>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const card=(f,i)=>`<article class="card" id="c${i}"><div class="card-head"><img class="avatar" src="${f.avatar}" alt="" onerror="this.style.visibility='hidden'"><div><h3>${f.icon} ${f.name}</h3><div class="type">${f.type} type · ${f.language}</div></div></div><div class="hp-label" id="hpt${i}"><span>HEALTH POINTS</span><b>${f.hp}</b></div><div class="hpwrap"><div class="hp" id="hp${i}"></div></div><div class="stats"><div class="stat"><span>⚔ ATTACK</span><b>${f.attack}</b><small>${f.raw.commits_30d} commits / 30d</small></div><div class="stat"><span>🛡 DEFENSE</span><b>${f.defense}</b><small>${Number(f.raw.closed_issues).toLocaleString()} closed issues</small></div><div class="stat"><span>⚡ SPEED</span><b>${f.speed}</b><small>Updated ${f.raw.days_since_push}d ago</small></div><div class="stat"><span>⭐ STARS</span><b>${Number(f.raw.stars).toLocaleString()}</b><small>Popularity score</small></div></div></article>`;
$("go").onclick=async()=>{$("go").disabled=true;["msg","arena","banner","log","src"].forEach(i=>$(i).innerHTML="");$("msg").textContent="Connecting to GitHub and summoning fighters…";
try{const q=new URLSearchParams({a:$("a").value.trim(),b:$("b").value.trim(),style:$("style").value});const res=await fetch("/api/battle?"+q);const d=await res.json();if(!res.ok||d.error)throw new Error(d.error||"Battle request failed. Check repository names and try again.");$("msg").textContent="";$("arena").innerHTML=card(d.a,0)+card(d.b,1);const F=[d.a,d.b],say=t=>{const e=document.createElement("div");e.className="line";e.textContent=t;return e};$("log").innerHTML='<div class="log-title">BATTLE FEED / LIVE COMMENTARY</div>';$("log").append(say("🎙 "+d.story.intro));await sleep(700);
for(let n=0;n<d.events.length;n++){const e=d.events[n],t=F[0].name===e.defender?0:1;$("hp"+t).style.width=Math.max(0,e.hp[t]/F[t].hp*100)+"%";$("hp"+t).style.background=e.hp[t]/F[t].hp<.3?"linear-gradient(90deg,#fb7185,#ef4444)":"linear-gradient(90deg,#34d399,#a3e635)";$("hpt"+t).lastElementChild.textContent=e.hp[t];$("c"+t).classList.add("hit");setTimeout(()=>$("c"+t).classList.remove("hit"),350);const l=say(`ROUND ${e.round}  ·  -${e.damage}${e.crit?"  💥 CRITICAL HIT":""}  —  ${d.story.lines[n]}`);if(e.crit)l.classList.add("crit");$("log").append(l);await sleep(750)}
const w=d.winner===F[0].name?0:1;$("c"+w).classList.add("win");$("c"+(1-w)).classList.add("dead");$("banner").textContent="🏆 "+d.winner+" WINS!";$("log").append(say("🎙 "+d.story.outro));$("src").textContent="Winner decided by code · narration: "+(d.story.source==="ai"?"AI-generated":"template fallback");}
catch(e){$("msg").innerHTML='<span class="err">'+e.message.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))+'</span>'}finally{$("go").disabled=false}};
</script></body></html>
